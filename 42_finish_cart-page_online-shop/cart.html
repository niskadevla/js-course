<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleShop — Cart</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="cart">
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo">StyleShop</a>
      <nav class="header__nav">
        <a href="index.html">Home</a>
        <a href="cart.html" class="header__cart header__cart--active">
          Cart
          <span class="header__cart-count">2</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container cart-page">
    <h1 class="cart-page__title">Your Cart</h1>

    <div id="cart-items" class="cart-list"></div>

    <div class="cart-summary">
      <p class="cart-summary__total">Total: <span id="cart-total"></span></p>
      <div class="cart-summary__actions">
        <a href="index.html" class="btn btn--outline">Continue shopping</a>
        <a href="payment.html" class="btn">Pay for goods</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 StyleShop. All rights reserved.</p>
  </footer>

  <script src="data/products.js"></script>
  <script defer src="data/cart.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/cart-page.js"></script>
</body>
</html>
