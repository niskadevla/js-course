<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">git --version
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0 text-center">
                            <i class="bi bi-check2-square me-2"></i>My Todo List
                        </h1>
                    </div>
                    <div class="card-body">
                        <form id="todo-form" class="mb-4">
                            <div class="input-group">
                                <input 
                                    type="text" 
                                    id="todo-input" 
                                    class="form-control" 
                                    placeholder="Add a new task..."
                                    autocomplete="off"
                                >
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-plus-lg"></i> Add
                                </button>
                            </div>
                        </form>
                        
                        <ul id="todo-list" class="list-group">
                        </ul>
                        
                        <div id="empty-state" class="text-center text-muted py-4">
                            <i class="bi bi-inbox h1"></i>
                            <p class="mb-0">No tasks yet. Add one above</p>
                        </div>
                    </div>
                    <div class="card-footer text-muted text-center">
                        <small><span id="todo-count">0</span> tasks remaining</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
